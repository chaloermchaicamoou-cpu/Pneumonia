    return typeof v === "number" && isFinite(v) ? `<c r="${ref}"${st}><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`; }).join("")}</row>`).join("")}</sheetData></worksheet>`;
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  return zipStore([
    {name:"[Content_Types].xml", data:`${X}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
    {name:"_rels/.rels", data:`${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:"xl/workbook.xml", data:`${X}<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xmlEsc(s.name.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>`},
    {name:"xl/_rels/workbook.xml.rels", data:`${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:"xl/styles.xml", data:`${X}<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Tahoma"/></font><font><b/><sz val="11"/><name val="Tahoma"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDBEAFE"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`},
    ...sheets.map((s, i) => ({name:`xl/worksheets/sheet${i + 1}.xml`, data:sheetXml(s.rows)}))
  ], "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}
const Export = {
  row(r){ const d = {...r, ...derive(r)}; return HEADERS.map(h => d[h] ?? ""); },
  summaryRows(recs){
    const s = buildSummary(recs, {}, SUMMARY_SPEC, {minCell:1, dayKey:dkey});
    const rows = [["รายการ","n","Mean","SD","ร้อยละระดับ 4–5","ระดับ","n(5)","n(4)","n(3)","n(2)","n(1)"]];
    if (!s.n) return {rows, s};
    SCHEMA.domains.forEach(d => { const st = s.domains[d.id]; rows.push([`ด้านที่ ${d.no} ${d.label}`, st.n, st.mean, st.sd, st.top2, interp(st.mean).l, "", "", "", "", ""]);
      d.items.forEach(i => { const it = s.items[i]; rows.push([`  ${F[i].no}. ${F[i].label}`, it.n, it.mean, it.sd, it.top2, interp(it.mean).l, ...it.dist]); }); });
    rows.push(["รวมทุกด้าน", s.overall.n, s.overall.mean, s.overall.sd, s.overall.top2, interp(s.overall.mean).l, "", "", "", "", ""]);
    rows.push([], ["ข้อมูลทั่วไป","ตัวเลือก","จำนวน","ร้อยละ"]);
    FILTER_FIELDS.forEach(f => f.options.forEach((op, i) => { const c = s.demographics[f.name][op.v] || 0; rows.push([i === 0 ? `${f.no}. ${f.label}` : "", op.l, c, Math.round(pct(c, s.n) * 10) / 10]); }));
    return {rows, s};
  },
  xlsx(recs, auditRows){
    const lab = [HEADERS, ...recs.map(r => HEADERS.map(h => F[h] && (F[h].options || F[h].type === "rating") ? optLabel(h, r[h]) : (r[h] ?? "")))];
    const sheets = [{name:"responses", rows:[HEADERS, ...recs.map(Export.row)]}, {name:"responses_labels", rows:lab}, {name:"summary", rows:Export.summaryRows(recs.filter(r => r.record_status === "submitted")).rows}, {name:"data_dictionary", rows:dataDictionary()}, {name:"value_labels", rows:valueLabels()}];
    if (auditRows) sheets.push({name:"audit_log", rows:[["timestamp","user","action","record_id","detail","status"], ...auditRows.map(a => [a.timestamp, a.user, a.action, a.record_id, a.detail, a.status])]});
    download(`CAP69_responses_${stamp()}.xlsx`, makeXlsx(sheets));
  },
  csv(recs){
    const q = v => { let s = String(v ?? ""); if (typeof v === "string" && /^[=+\-@]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    download(`CAP69_responses_${stamp()}.csv`, "﻿" + [HEADERS.join(","), ...recs.map(r => Export.row(r).map(q).join(","))].join("\r\n"), "text/csv;charset=utf-8");
  },
  json(recs){ download(`CAP69_responses_${stamp()}.json`, JSON.stringify({schema:SCHEMA.id, exported_at:nowISO(), headers:HEADERS, count:recs.length, records:recs.map(r => Object.fromEntries(HEADERS.map((h, i) => [h, Export.row(r)[i]])))}, null, 2), "application/json"); },
  print(recs, withOE){
    const sub = recs.filter(r => r.record_status === "submitted"), c = cfg(), {rows, s} = Export.summaryRows(sub);
    let h = `<h1>${esc(c.headerTitle)}</h1><div>${esc(c.headerSubtitle)} · ${esc(c.orgName)}</div><div style="font-size:10pt;color:#555">พิมพ์เมื่อ ${fmtDT(nowISO())} · จำนวนผู้ตอบ ${sub.length} ราย${s.n ? ` · ค่าเฉลี่ยรวม ${f2(s.overall.mean)} (SD ${f2(s.overall.sd)}) ระดับ${interp(s.overall.mean).l}` : ""}</div>`;
    if (s.n) {
      h += `<h2>ตารางที่ 1 ข้อมูลทั่วไปของผู้ตอบแบบสอบถาม (n = ${sub.length})</h2><table><tr><th>ข้อมูล</th><th>ตัวเลือก</th><th class="num">จำนวน</th><th class="num">ร้อยละ</th></tr>`;
      FILTER_FIELDS.forEach(f => f.options.forEach((op, i) => { const cnt = s.demographics[f.name][op.v] || 0; h += `<tr>${i === 0 ? `<td rowspan="${f.options.length}">${f.no}. ${esc(f.label)}</td>` : ""}<td>${esc(op.l)}</td><td class="num">${cnt}</td><td class="num">${pct(cnt, s.n).toFixed(1)}</td></tr>`; }));
      h += `</table><h2 class="pb">ตารางที่ 2 ความพึงพอใจต่อการใช้แนวปฏิบัติ รายด้านและรายข้อ</h2><table><tr><th>รายการประเมิน</th><th class="num">Mean</th><th class="num">SD</th><th>ระดับ</th><th class="num">5</th><th class="num">4</th><th class="num">3</th><th class="num">2</th><th class="num">1</th></tr>`;
      rows.slice(1).forEach(r => { if (!r.length || r[0] === "ข้อมูลทั่วไป" || typeof r[1] !== "number" || typeof r[2] !== "number") return; const bold = !String(r[0]).startsWith("  ");
        h += `<tr style="${bold ? "font-weight:bold;background:#f5f5f5" : ""}"><td>${esc(String(r[0]).trim())}</td><td class="num">${f2(r[2])}</td><td class="num">${f2(r[3])}</td><td>${esc(r[5])}</td>${[6,7,8,9,10].map(i => `<td class="num">${r[i] ?? ""}</td>`).join("")}</tr>`; });
      h += `</table><div style="font-size:9.5pt">เกณฑ์แปลความหมาย: 4.51–5.00 มากที่สุด, 3.51–4.50 มาก, 2.51–3.50 ปานกลาง, 1.51–2.50 น้อย, 1.00–1.50 น้อยที่สุด<br>หมายเหตุ: ${esc(SCHEMA.revisedNote)}</div>`;
    } else h += `<p>ยังไม่มีข้อมูลที่สมบูรณ์</p>`;
    if (withOE) { h += `<h2 class="pb">ตอนที่ 3 ข้อเสนอแนะเพิ่มเติม</h2>`; OE_FIELDS.forEach(f => { const list = sub.map(r => r[f.name]).filter(v => !isEmpty(v)); h += `<h3 style="font-size:12pt">${f.no}. ${esc(f.label)} (${list.length} ราย)</h3>${list.length ? `<ol>${list.map(v => `<li>${esc(v)}</li>`).join("")}</ol>` : "<p>– ไม่มี –</p>"}`; }); }
    $("#printArea").innerHTML = h;
    setTimeout(() => window.print(), 100);
  }
};

          }

      }});

  importFile(file){
    const rd = new FileReader();

        const list = arr.filter(x => x && typeof x === "object").map(x => { const o = {}; HEADERS.forEach(h => { if (x[h] !== undefined) o[h] = x[h]; }); return o; });
        if (!await confirmDialog({title:"ยืนยันการนำเข้าข้อมูล", body:`พบ <b>${list.length}</b> รายการในไฟล์ <b>${esc(file.name)}</b><br>ระบบจะข้ามรายการที่ record_id หรือ qid ซ้ำ และตรวจสอบข้อมูลทุกรายการก่อนบันทึก`, ok:"นำเข้า"})) return;

        toast(`นำเข้า ${r.imported} รายการ · ซ้ำ ${r.duplicates} · มีหมายเหตุ ${r.failed.length}`, r.failed.some(x => x.error) ? "warn" : "ok", 6000);

      } catch (e) { toast("นำเข้าไม่สำเร็จ: " + e.message, "err", 6000); }

          <li>Dashboard สาธารณะรับเฉพาะข้อมูลสรุป (action=summary) ไม่มี qid/ข้อความปลายเปิด และปิดบังกลุ่ม n &lt; ${API.mode === "gas" ? "MIN_CELL_SIZE" : c.minCellSize}</li>
          <li>ข้อมูลรายบุคคล แก้ไข และลบ ต้องมี Token ผู้ดูแล ซึ่งตรวจสอบที่ ${API.mode === "gas" ? "Apps Script ทุกคำขอ" : "เบราว์เซอร์ (Demo Mode ไม่ใช่ระบบความปลอดภัยจริง)"}</li>
          <li>ข้อความทุกช่องถูกตัด HTML/Script ก่อนบันทึก และ escape ก่อนแสดงผล</li>
          <li>ไม่เก็บชื่อ เลขประจำตัว หรือเบอร์โทรศัพท์ของผู้ตอบ (ตามคำชี้แจง “ไม่ต้องระบุชื่อ”)</li>
          <li>จำกัดสิทธิ์แชร์ Google Sheets เฉพาะผู้รับผิดชอบ และกำหนดระยะเวลาเก็บรักษาข้อมูลตามโครงการวิจัย/PDPA</li></ul></div>
    </div>`;
    $("#sCred").onsubmit = async e => {
      e.preventDefault(); const cur = $("#sCur").value, u = $("#sU").value.trim(), p1 = $("#sP1").value, p2 = $("#sP2").value;
      if (!/^[A-Za-z0-9_.@-]{3,32}$/.test(u)) return toast("ชื่อผู้ใช้ต้องเป็น a-z 0-9 _ . @ - ยาว 3–32 ตัว", "err");
      if (p1.length < 8) return toast("รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร", "err");
      if (p1 === "admin" || p1.toLowerCase() === u.toLowerCase()) return toast("รหัสผ่านใหม่คาดเดาง่ายเกินไป", "err");
      if (p1 !== p2) return toast("ยืนยันรหัสผ่านไม่ตรงกัน", "err");
      if (!await confirmDialog({title:"ยืนยันการเปลี่ยนบัญชีผู้ดูแล", body:`ชื่อผู้ใช้ใหม่: <b>${esc(u)}</b><br>หลังเปลี่ยนต้องเข้าสู่ระบบใหม่ กรุณาจดจำรหัสผ่าน${API.mode === "gas" ? " (หากลืม ให้รัน resetAdminToDefault() ใน Apps Script)" : ""}`})) return;
      const b = $("#sCredBtn"); b.disabled = true;
      try { await API.changePassword(cur, u, p1); toast("เปลี่ยนบัญชีผู้ดูแลสำเร็จ กรุณาเข้าสู่ระบบใหม่"); Session.clear(); Admin.login(); }
      catch (err) { toast(err.message, "err", 6000); b.disabled = false; }
    };
    let logoData = null;
    $("#sLogo").onchange = e => { const fl = e.target.files[0]; if (!fl) return; if (fl.size > 300 * 1024) { toast("ไฟล์รูปใหญ่เกิน 300KB", "err"); e.target.value = ""; return; } const rd = new FileReader(); rd.onload = () => { logoData = rd.result; toast("เลือกรูปโลโก้แล้ว กด “บันทึกรูปลักษณ์” เพื่อใช้งาน"); }; rd.readAsDataURL(fl); };
    $("#sBrand").onsubmit = e => {
      e.preventDefault(); const fd = new FormData(e.target), b = {};
      for (const [k, v] of fd.entries()) if (typeof v === "string") b[k] = k.endsWith("Color") ? v : sanitizeText(v, 200);
      if (b.logo === "(รูปภาพที่อัปโหลด)") b.logo = cfg().logo;
      if (logoData) b.logo = logoData;
      if (b.logo && /^javascript:/i.test(b.logo)) b.logo = "";
      const s = Store.settings(); s.brand = b; Store.saveSettings(s); applyBrand(); toast("บันทึกรูปลักษณ์แล้ว"); Admin.render();
    };
    $("#sBrandReset").onclick = async () => { if (!await confirmDialog({title:"คืนค่ารูปลักษณ์จากไฟล์?", body:"ค่าที่ตั้งไว้ในหน้านี้จะถูกล้าง และกลับไปใช้ค่าจาก APP_CONFIG"})) return; const s = Store.settings(); delete s.brand; Store.saveSettings(s); applyBrand(); Admin.render(); toast("คืนค่าแล้ว"); };
    const on = (id, fn) => { const el = $("#" + id); if (el) el.onclick = fn; };
    on("sTest", async () => { try { const s = await API.status(); toast(`เชื่อมต่อสำเร็จ · ${s.spreadsheet} · Header ${s.headers_ok ? "ครบ" : "ขาด " + s.missing_headers.join(",")} · ${s.records_submitted} รายการ`, s.headers_ok ? "ok" : "warn", 6000); } catch (e) { toast(e.message, "err", 6000); } });
    on("sFlush", async () => { await Outbox.flush(true); Admin.settings(); });
    on("sBad", () => download(`CAP69_rejected_${stamp()}.json`, JSON.stringify(LS.get("outbox_failed", []), null, 2), "application/json"));
    on("sMigrate", async () => {
      const recs = Store.records();
      if (!await confirmDialog({title:"ย้ายข้อมูล Demo ขึ้น Google Sheets?", body:`ส่ง ${recs.length} รายการจากเบราว์เซอร์นี้ไปยัง Google Sheets (ข้ามรายการซ้ำ)${recs.some(r => r.created_by === "demo") ? "<br><b>คำเตือน:</b> มีข้อมูลตัวอย่าง (demo) ปะปนอยู่" : ""}`, ok:"ส่งข้อมูล"})) return;
      try { const r = (await API.importMany(recs)).data; toast(`ส่งขึ้น Sheets ${r.imported} รายการ · ซ้ำ ${r.duplicates}`, "ok", 6000); await Admin.reload(); Admin.tab = "settings"; Admin.render(); } catch (e) { toast(e.message, "err", 6000); }
    });
    on("sDemo", async () => { if (!await confirmDialog({title:"โหลดข้อมูลตัวอย่าง?", body:"เพิ่มข้อมูลสมมติ (created_by = demo) เพื่อทดสอบ Dashboard และการส่งออก"})) return; const n = await loadDemo(); toast(`เพิ่มข้อมูลตัวอย่าง ${n} รายการแล้ว`); await Admin.reload(); Admin.tab = "settings"; Admin.render(); });
    on("sDemoDel", async () => { const n = Store.records().filter(r => r.created_by === "demo").length; if (!n) return toast("ไม่มีข้อมูลตัวอย่าง", "warn"); if (!await confirmDialog({title:"ลบข้อมูลตัวอย่าง?", body:`ลบข้อมูลตัวอย่าง ${n} รายการ`, danger:true, ok:"ลบ"})) return; Store.saveRecords(Store.records().filter(r => r.created_by !== "demo")); Store.log(ses.username, "delete", "", `ลบข้อมูลตัวอย่าง ${n} รายการ`); toast(`ลบข้อมูลตัวอย่าง ${n} รายการแล้ว`, "warn"); await Admin.reload(); Admin.tab = "settings"; Admin.render(); });
    on("sWipe", async () => { const n = Store.records().length; if (!n) return toast("ไม่มีข้อมูล", "warn"); if (!await confirmDialog({title:"ล้างข้อมูลทั้งหมด?", body:`ข้อมูล ${n} รายการในเบราว์เซอร์นี้จะถูกลบถาวร แนะนำให้ส่งออก JSON ก่อน`, danger:true, ok:"ล้างข้อมูล", requireText:"ยืนยัน"})) return; Store.saveRecords([]); Store.log(ses.username, "delete", "", `ล้างข้อมูลทั้งหมด ${n} รายการ`); toast(`ล้างข้อมูล ${n} รายการแล้ว`, "warn"); await Admin.reload(); Admin.tab = "settings"; Admin.render(); });
  }
};

/* ---- ข้อมูลตัวอย่าง (Demo Mode) ---- */
/** สร้างข้อมูลตัวอย่างแบบสุ่มคงที่ (seed) — ตัวแปรจริงครบทุกตัว ใช้ทั้งในเครื่องและสร้าง sample_data.json */
function generateSample(n=40, seed=2569){
  let t = seed >>> 0; const rnd = () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; };
  const pick = w => { let s = rnd() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < w.length; i++) { s -= w[i]; if (s <= 0) return i + 1; } return w.length; };
  const oe = [["ขั้นตอนชัดเจน ใช้ง่าย", "checklist ช่วยไม่ให้ลืมขั้นตอน", "ช่วยให้ประเมินความรุนแรงได้เร็วขึ้น"], ["ภาระงานเอกสารเพิ่มขึ้นช่วงแรก", "อุปกรณ์บางอย่างไม่เพียงพอในเวรดึก", "บุคลากรใหม่ยังไม่คุ้นเคย"], ["ควรทำเป็นแบบฟอร์มอิเล็กทรอนิกส์", "ควรจัดอบรมทบทวนทุก 6 เดือน", "ควรมีโปสเตอร์สรุปขั้นตอนที่หน้างาน"]];
  const base0 = Date.UTC(2026, 9, 1, 1, 0);   // 1 ต.ค. 2569
  return Array.from({length:n}, (_, i) => {
    const ts = new Date(base0 + Math.floor(rnd() * 50) * 86400000 + Math.floor(rnd() * 9 * 3600000)).toISOString();
    const r = {record_id:`R-DEMO-${String(i + 1).padStart(4, "0")}`, qid:`DEMO-${String(i + 1).padStart(4, "0")}`, sex:pick([3,6.5,.5]), age:pick([3,4,2,1]), prof:pick([1.2,5,1.5,1.3]), edu:pick([.6,7,1.4]), exp:pick([3,3,2.5,1.5]), train:pick([7,3]), cases:pick([3,4,3])};
    const base = 3.4 + rnd() * 1.4;
    ITEMS.forEach(f => { const adj = f.domain === "d2" ? -.35 : f.domain === "d3" ? .2 : 0; r[f.name] = Math.max(1, Math.min(5, Math.round(base + adj + (rnd() - .5) * 1.6))); });
    OE_FIELDS.forEach((f, k) => r[f.name] = rnd() < .35 ? oe[k][Math.floor(rnd() * 3)] : "");
    return {...r, ...derive(r), record_status:"submitted", created_at:ts, created_by:"demo", updated_at:ts, updated_by:"demo"};
  });
}
async function loadDemo(){
  let list = null;
  try { const res = await fetch("sample_data.json", {cache:"no-store"}); if (res.ok) { const j = await res.json(); list = j.records; } } catch {}
  if (!Array.isArray(list)) list = generateSample();
  const recs = Store.records(), ids = new Set(recs.map(r => r.record_id)), qids = new Set(recs.map(r => r.qid));
  const add = list.filter(r => !ids.has(r.record_id) && !qids.has(r.qid)).map(r => ({...r, ...derive(r), created_by:"demo", updated_by:"demo"}));
  Store.saveRecords([...recs, ...add]); Store.log(Session.user(), "import", "", `โหลดข้อมูลตัวอย่าง ${add.length} รายการ`);
  return add.length;
}

/* =====================================================================
   13) BRANDING / THEME / ROUTER / INIT
   ===================================================================== */
function logoHTML(l){ l = String(l || ""); return /^(data:image\/(png|jpe?g|gif|webp|svg\+xml);|https?:\/\/|\.{0,2}\/|[\w-]+\.(png|jpe?g|svg|gif|webp)$)/i.test(l) ? `<img src="${esc(l)}" alt="โลโก้">` : esc(l.slice(0, 4)); }
function applyBrand(){
  const c = cfg(), root = document.documentElement;
  root.style.setProperty("--primary", c.primaryColor); root.style.setProperty("--accent", c.accentColor);
  $("#brandLogo").innerHTML = logoHTML(c.logo);
  $("#brandName").textContent = c.appName; $("#brandOrg").textContent = c.orgName;
  document.title = c.appName;
  $("#footer").innerHTML = `${esc(c.orgName)} · ${esc(c.appName)} · รายงานผลในภาพรวมเท่านั้น ไม่ระบุตัวบุคคล`;
  const fv = $("#view-form");
  if (fv.dataset.mounted && FormView.fr) { const {data, step} = FormView.fr; const rid = FormView.recordId; fv.dataset.mounted = ""; FormView.fr = null; FormView.mount(); FormView.fr.data = data; FormView.fr.step = step; FormView.recordId = rid; FormView.fr.render(); }
}
function setTheme(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; try { localStorage.setItem(P + "theme", t || ""); } catch {} }
$("#themeBtn").onclick = () => { const cur = document.documentElement.dataset.theme; const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; setTheme(dark ? "light" : "dark"); };
try { const t = localStorage.getItem(P + "theme"); if (t) setTheme(t); } catch {}
$("#modeChip").onclick = () => Net.info();

const Router = {
  current:null,
  go(){
    let r = (location.hash.match(/^#\/(\w+)/) || [])[1];
    if (!["form","dashboard","admin"].includes(r)) { r = "form"; if (location.hash !== "#/form") history.replaceState(null, "", "#/form"); }
    Router.current = r;
    ["form","dashboard","admin"].forEach(v => $("#view-" + v).classList.toggle("hidden", v !== r));
    $$(".nav a").forEach(a => a.classList.toggle("active", a.dataset.route === r));
    $$(".modal-bg").forEach(m => m.remove());
    ({form:FormView.mount, dashboard:Dash.mount, admin:Admin.mount})[r]();
    window.scrollTo({top:0});
  }
};
window.addEventListener("hashchange", Router.go);
window.addEventListener("online", () => { Net.state("checking"); Outbox.flush(); });
window.addEventListener("offline", () => Net.state("offline"));
window.addEventListener("storage", e => { if (!APP_CONFIG.dashboardGasOnly && e.key === P + "records_v2" && Router.current === "dashboard") Dash.load(true); });
/* Dashboard ดึงข้อมูลใหม่อัตโนมัติ + ส่งคิวค้างเป็นระยะ */
setInterval(() => {
  if (document.hidden) return;
  if (Router.current === "dashboard" && APP_CONFIG.autoRefreshSec > 0 && Date.now() - (Dash.lastAuto || 0) >= APP_CONFIG.autoRefreshSec * 1000) { Dash.lastAuto = Date.now(); Dash.load(true); }
  if (Outbox.list().length && navigator.onLine) Outbox.flush();
}, 15000);

applyBrand();
Net.render();
/* เปิดเว็บไซต์: แสดงหน้าแบบสอบถามเป็นหน้าแรกเสมอ (ยกเว้นเปิดผ่านลิงก์ #/dashboard หรือ #/admin โดยตรง) */
Router.go();
if (API.mode === "gas") API.status().then(() => Outbox.flush()).catch(() => {});
</script>
