<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แบบสอบถามความพึงพอใจ CAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   ⚙️ CONFIGURATION — จุดกำหนดค่าเพียงจุดเดียว
   - GAS_API_URL: ใส่ URL ของ Google Apps Script Web App (ลงท้ายด้วย /exec)
       ว่าง ""  → Demo Mode (เก็บข้อมูลใน Local Storage ของเบราว์เซอร์)
       มีค่า    → ใช้ Google Sheets ทันที (บันทึก/อ่าน/แก้ไข/ลบ ผ่าน API)
   - ชื่อระบบ หน่วยงาน สี โลโก้ ข้อความส่วนหัว ปรับได้ที่นี่
     (ผู้ดูแลปรับทับเฉพาะรูปลักษณ์ได้จากหน้า ผู้ดูแล > ตั้งค่า)
   ===================================================================== */
window.APP_CONFIG = {
  GAS_API_URL:    "https://script.google.com/macros/s/AKfycbziPe-BNAsWJNyeDn5sgtvPGoHLbKaAVuYrdbNO-0BM4z1x_PjK4jVScKXdERmNGhaGyg/exec",
  dashboardGasOnly: true,             // Dashboard แสดงเฉพาะข้อมูลจาก Google Sheets (ไม่ใช้ข้อมูลในเครื่อง/Demo)
  apiTimeoutMs:   20000,              // เวลารอ API สูงสุด (มิลลิวินาที)
  autoRefreshSec: 60,                 // Dashboard ดึงข้อมูลใหม่อัตโนมัติทุกกี่วินาที (0 = ปิด)

  appName:        "ระบบแบบสอบถามความพึงพอใจ",
  orgName:        "โรงพยาบาลหนองสองห้อง",
  headerTitle:    "แบบสอบถามความพึงพอใจของทีมสหวิชาชีพต่อการใช้แนวปฏิบัติ",
  headerSubtitle: "แนวปฏิบัติการดูแลผู้ป่วยโรคปอดอักเสบชุมชน · ปีงบประมาณ 2569",
  logo:           "🫁",               // อีโมจิ ตัวอักษร หรือ URL/Data URL ของรูปภาพ
  primaryColor:   "#2563eb",
  accentColor:    "#7c3aed",
  qidPrefix:      "Q69-",             // เลขที่แบบสอบถามอัตโนมัติ (Demo Mode; โหมด Sheets ใช้ QID_PREFIX ใน Script Properties)
  minCellSize:    5,                  // กลุ่มย่อยที่น้อยกว่านี้ไม่แสดงผล (Demo Mode; โหมด Sheets ใช้ MIN_CELL_SIZE)
  storagePrefix:  "cap69sat_",
  defaultAdmin:   { username: "admin", password: "admin" }   // ใช้เฉพาะ Demo Mode
};
</script>
<style>
:root{
  --primary:#2563eb; --accent:#7c3aed;
  --bg:#eef2f8; --surface:rgba(255,255,255,.72); --surface-solid:#ffffff;
  --surface-2:rgba(255,255,255,.5); --border:rgba(255,255,255,.75); --line:rgba(15,23,42,.09);
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --shadow:0 10px 30px -12px rgba(15,23,42,.18), 0 2px 6px -2px rgba(15,23,42,.06);
  --neu-out:6px 6px 14px rgba(163,177,198,.45), -6px -6px 14px rgba(255,255,255,.9);
  --neu-in:inset 3px 3px 7px rgba(163,177,198,.45), inset -3px -3px 7px rgba(255,255,255,.9);
  --ok:#059669; --warn:#d97706; --err:#dc2626;
  --l5:#059669; --l4:#22c55e; --l3:#eab308; --l2:#f97316; --l1:#ef4444;
  --radius:20px; --radius-sm:12px;
  --p-soft:color-mix(in srgb,var(--primary) 12%,transparent);
  --p-mid:color-mix(in srgb,var(--primary) 30%,transparent);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --surface:rgba(23,30,52,.72); --surface-solid:#151c31; --surface-2:rgba(30,41,66,.55);
    --border:rgba(255,255,255,.08); --line:rgba(255,255,255,.08); --text:#e8edf7; --text-2:#a7b2c7; --text-3:#6b7890;
    --shadow:0 10px 30px -12px rgba(0,0,0,.6);
    --neu-out:5px 5px 12px rgba(0,0,0,.45), -4px -4px 10px rgba(255,255,255,.03);
    --neu-in:inset 3px 3px 7px rgba(0,0,0,.5), inset -3px -3px 7px rgba(255,255,255,.03);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:rgba(23,30,52,.72); --surface-solid:#151c31; --surface-2:rgba(30,41,66,.55);
  --border:rgba(255,255,255,.08); --line:rgba(255,255,255,.08); --text:#e8edf7; --text-2:#a7b2c7; --text-3:#6b7890;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  --neu-out:5px 5px 12px rgba(0,0,0,.45), -4px -4px 10px rgba(255,255,255,.03);
  --neu-in:inset 3px 3px 7px rgba(0,0,0,.5), inset -3px -3px 7px rgba(255,255,255,.03);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 600px at 0% 0%,color-mix(in srgb,var(--primary) 22%,transparent),transparent 60%),
             radial-gradient(800px 600px at 100% 10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%),
             radial-gradient(900px 700px at 50% 110%,color-mix(in srgb,#06b6d4 14%,transparent),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.netbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;overflow:hidden;opacity:0;transition:opacity .2s}
.netbar.on{opacity:1}
.netbar::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--primary),var(--accent),transparent);animation:slide 1.1s infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.topbar{position:sticky;top:0;z-index:40;backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  background:color-mix(in srgb,var(--surface-solid) 70%,transparent);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none;color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:0 6px 16px -6px var(--primary);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t span{display:block;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.nav a{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px;text-decoration:none;color:var(--text-2);font-size:14.5px;font-weight:500;white-space:nowrap}
.nav a.active{background:var(--surface-solid);color:var(--primary);box-shadow:0 2px 8px -2px rgba(15,23,42,.15)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-solid)}
.mode-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.mode-chip .d{width:8px;height:8px;border-radius:50%;background:var(--text-3)}
.mode-chip.local .d{background:var(--warn)} .mode-chip.online .d{background:var(--ok)} .mode-chip.offline .d{background:var(--err)}
.mode-chip .q{background:var(--err);color:#fff;border-radius:99px;padding:0 6px;font-size:11px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

main{max-width:1280px;margin:0 auto;padding:22px 16px 80px}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Cards ---------- */
.glass{background:var(--surface);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card{padding:22px;min-width:0}
.card h3{margin:0 0 4px;font-size:17px;font-weight:600}
.card .sub{margin:0 0 16px;color:var(--text-2);font-size:13.5px}
.hero{padding:26px 26px 22px;margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--accent));opacity:.12;pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--primary);background:var(--p-soft);padding:4px 10px;border-radius:999px}
.hero h1{margin:10px 0 4px;font-size:clamp(20px,3vw,27px);line-height:1.35;font-weight:700;letter-spacing:-.2px}
.hero p{margin:0;color:var(--text-2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.g2,.g3{grid-template-columns:1fr}}
@media (max-width:640px){.kpis,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-solid);cursor:pointer;font-weight:500;font-size:15px;transition:transform .12s,box-shadow .2s;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{box-shadow:0 4px 14px -6px rgba(15,23,42,.25)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 70%,var(--accent)));color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px var(--primary)}
.btn.danger{background:var(--err);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.soft{background:var(--p-soft);color:var(--primary);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- Form ---------- */
.form-wrap{max-width:900px;margin:0 auto}
.progress-card{padding:16px 20px;margin-bottom:16px;position:sticky;top:72px;z-index:20}
.progress-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--text-2);margin-bottom:8px;gap:10px}
.progress-top b{color:var(--text);font-weight:600}
.pbar{height:10px;border-radius:99px;background:var(--surface-2);box-shadow:var(--neu-in);overflow:hidden}
.pbar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s cubic-bezier(.2,.8,.2,1)}
.stepper{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.stepper::-webkit-scrollbar{display:none}
.step-chip{flex:none;display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);cursor:pointer}
.step-chip .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--line)}
.step-chip.cur{border-color:var(--primary);color:var(--primary);background:var(--p-soft)}
.step-chip.cur .n{background:var(--primary);color:#fff}
.step-chip.done .n{background:var(--ok);color:#fff}
.section-card{padding:26px}
.sec-head{margin-bottom:18px}
.sec-head .part{font-size:13px;font-weight:600;color:var(--primary)}
.sec-head h2{margin:2px 0 4px;font-size:21px;font-weight:700;line-height:1.4}
.sec-head p{margin:0;color:var(--text-2);font-size:14px}
.intro{padding:16px 18px;border-radius:var(--radius-sm);background:var(--p-soft);border:1px solid var(--p-mid);font-size:14.5px;margin-bottom:18px}
.intro b{color:var(--primary)}
.field{padding:18px 0;border-top:1px dashed var(--line)}
.field:first-of-type{border-top:0}
.f-label{display:flex;gap:10px;font-weight:600;font-size:16px;margin-bottom:12px;line-height:1.5}
.f-label .no{flex:none;min-width:30px;height:30px;padding:0 8px;border-radius:10px;display:grid;place-items:center;font-size:13.5px;background:var(--p-soft);color:var(--primary)}
.f-label .req{color:var(--err);margin-left:2px}
.f-help{font-size:13px;color:var(--text-3);margin:-6px 0 10px 40px}
.f-err{color:var(--err);font-size:13.5px;margin-top:8px;display:flex;align-items:center;gap:6px}
.field.has-err .opt,.field.has-err .rate{border-color:color-mix(in srgb,var(--err) 45%,transparent)}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.opt{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:14px;cursor:pointer;text-align:left;
  background:var(--surface-solid);border:1.5px solid var(--line);box-shadow:var(--neu-out);transition:all .18s;font-size:15px;line-height:1.4;min-height:52px}
.opt:hover{border-color:var(--p-mid);transform:translateY(-1px)}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--text-3);display:grid;place-items:center;transition:all .18s}
.opt.cb .dot{border-radius:6px}
.opt.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--surface-solid));box-shadow:var(--neu-in)}
.opt.sel .dot{border-color:var(--primary);background:var(--primary)}
.opt.sel .dot::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.opt.cb.sel .dot::after{width:9px;height:5px;border-radius:0;background:transparent;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.rating{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;border-radius:14px;cursor:pointer;
  background:var(--surface-solid);border:1.5px solid var(--line);box-shadow:var(--neu-out);transition:all .18s;min-height:66px}
.rate b{font-size:20px;font-weight:700;line-height:1.1}
.rate span{font-size:12px;color:var(--text-2);text-align:center;line-height:1.3}
.rate:hover{transform:translateY(-1px);border-color:var(--p-mid)}
.rate.sel{color:#fff;border-color:transparent;background:var(--c);box-shadow:var(--neu-in),0 6px 16px -8px var(--c)}
.rate.sel span{color:rgba(255,255,255,.92)}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-solid);box-shadow:var(--neu-in);outline:none;transition:border .15s;font-size:15.5px}
.inp:focus{border-color:var(--primary)}
textarea.inp{min-height:110px;resize:vertical}
.field.has-err .inp{border-color:var(--err)}
.toggle{display:inline-flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;padding:0}
.toggle .tr{width:52px;height:30px;border-radius:99px;background:var(--line);box-shadow:var(--neu-in);position:relative;transition:background .2s}
.toggle .tr::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on .tr{background:var(--primary)}
.toggle.on .tr::after{transform:translateX(22px)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.scale-legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px;font-size:13px;color:var(--text-2)}
.scale-legend span{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.scale-legend i{width:10px;height:10px;border-radius:3px}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;padding:16px;align-items:center}
@media (max-width:640px){
  .section-card{padding:18px}
  .opts{grid-template-columns:1fr}
  .rate{min-height:60px;padding:8px 2px}
  .rate span{font-size:10.5px}
  .rate b{font-size:18px}
  .form-actions .btn{flex:1 1 auto}
  .progress-card{top:64px;padding:12px 14px}
  .f-help{margin-left:0}
}
.review-list{display:grid;gap:10px}
.review-sec{padding:14px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.review-sec h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.review-row{display:flex;gap:10px;font-size:14px;padding:4px 0;border-top:1px dashed var(--line)}
.review-row:first-of-type{border-top:0}
.review-row .k{flex:1;color:var(--text-2);min-width:0}
.review-row .v{flex:none;max-width:50%;text-align:right;font-weight:500;word-break:break-word}
.review-row .v.miss{color:var(--err)}
.success{text-align:center;padding:48px 24px}
.success .check{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.success .check.q{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.success .check svg{width:44px;height:44px;stroke-width:2.5}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;margin-bottom:14px;font-size:14.5px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--warn) 12%,var(--surface-solid));border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.info{background:color-mix(in srgb,var(--primary) 9%,var(--surface-solid));border-color:var(--p-mid)}
.banner.err{background:color-mix(in srgb,var(--err) 9%,var(--surface-solid));border-color:color-mix(in srgb,var(--err) 30%,transparent)}

/* ---------- Dashboard ---------- */
.filters{padding:16px 18px;margin-bottom:16px}
.filters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.filters label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:4px;font-weight:500}
.sel{width:100%;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-solid);font-size:14px;outline:none;max-width:100%;min-width:0}
.sel:focus{border-color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;background:var(--p-soft);color:var(--primary);border:0;cursor:pointer}
.kpi{padding:18px;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden;min-width:0}
.kpi:hover{transform:translateY(-2px)}
.kpi .k-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px;color:#fff}

function confirmDialog({title="ยืนยันการดำเนินการ", body="", ok="ยืนยัน", danger=false, requireText=""}){
  return new Promise(res => {
    let done = false;
    modal({title, body:`<div style="color:var(--text-2)">${body}</div>${requireText ? `<input class="inp" id="cfTxt" style="margin-top:10px" placeholder="พิมพ์ ${esc(requireText)}" autocomplete="off">` : ""}`,
      footer:`<button class="btn" data-close>ยกเลิก</button><button class="btn ${danger ? "danger" : "primary"}" data-ok ${requireText ? "disabled" : ""}>${ok}</button>`,
      onMount:(el, close, m) => {
        const okB = $("[data-ok]", el);
        m.onClose = () => { if (!done) res(false); };
        okB.addEventListener("click", () => { done = true; close(); res(true); });
        if (requireText) { const t = $("#cfTxt", el); t.addEventListener("input", () => okB.disabled = t.value.trim() !== requireText); setTimeout(() => t.focus(), 30); }
        else setTimeout(() => okB.focus(), 30);
      }});
  });
}

/* SHA-256 (ใช้กับบัญชีผู้ดูแลใน Demo Mode; ทำงานได้แม้เปิดไฟล์จากเครื่อง) */
const sha256 = (() => {
  const K = [], H0 = []; let n = 2, c = 0;
  const isP = x => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
  while (c < 64) { if (isP(n)) { if (c < 8) H0[c] = (Math.pow(n, 1/2) * 4294967296) | 0; K[c] = (Math.pow(n, 1/3) * 4294967296) | 0; c++; } n++; }
  return str => {
    const bytes = new TextEncoder().encode(str), l = bytes.length;
    const buf = new Uint8Array(((l + 9 + 63) >> 6) << 6); buf.set(bytes); buf[l] = 0x80;
    const dv = new DataView(buf.buffer), bits = l * 8;
    dv.setUint32(buf.length - 4, bits >>> 0); dv.setUint32(buf.length - 8, Math.floor(bits / 4294967296));
    let H = H0.slice(); const W = new Array(64);
    for (let off = 0; off < buf.length; off += 64) {
      for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4) | 0;
      for (let i = 16; i < 64; i++) {
        const a15 = W[i-15], a2 = W[i-2];
        const s0 = ((a15>>>7)|(a15<<25)) ^ ((a15>>>18)|(a15<<14)) ^ (a15>>>3);
        const s1 = ((a2>>>17)|(a2<<15)) ^ ((a2>>>19)|(a2<<13)) ^ (a2>>>10);
        W[i] = (W[i-16] + s0 + W[i-7] + s1) | 0;
      }
      let [a,b,cc,d,e,f,g,h] = H;
      for (let i = 0; i < 64; i++) {
        const S1 = ((e>>>6)|(e<<26)) ^ ((e>>>11)|(e<<21)) ^ ((e>>>25)|(e<<7));
        const t1 = (h + S1 + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
        const S0 = ((a>>>2)|(a<<30)) ^ ((a>>>13)|(a<<19)) ^ ((a>>>22)|(a<<10));
        const t2 = (S0 + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
      }
      H = [a,b,cc,d,e,f,g,h].map((v, i) => (v + H[i]) | 0);
    }
    return H.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
  };
})();

/* ย้ายข้อมูลรุ่นก่อน (v1: _id, QID, SEX ...) มาเป็นชื่อคอลัมน์มาตรฐาน */
(function migrateV1(){

  const conv = old.map(r => { const o = {record_id:r._id || newRecordId()}; FIELDS.forEach(f => { const k = f.name.toUpperCase(); o[f.name] = r[k] ?? r[f.name] ?? ""; });
    o.record_status = r.status || "submitted"; o.created_at = r.createdAt || nowISO(); o.updated_at = r.updatedAt || o.created_at; o.created_by = r.source === "form" ? "public_form" : (r.source || "migrated"); o.updated_by = o.created_by; return {...o, ...derive(o)}; });
  LS.set("records_v2", conv); LS.del("records");

function cfg(){ return {...APP_CONFIG, ...(Store.settings().brand || {})}; }

/* =====================================================================
   4) RECORD RULES — normalize / validate / derive
      (ตรรกะเดียวกับ normalize_ / validate_ / derived_ ใน Code.gs)
   ===================================================================== */
function visible(f, data){
  if (!f.showIf) return true;
  const v = data[f.showIf.field];
  const vals = isEmpty(v) ? [] : String(v).split(MULTI_SEP).map(x => isNaN(+x) ? x : +x);
  return vals.some(x => f.showIf.in.includes(x));
}
/** ตรวจหนึ่งช่องสำหรับหน้าฟอร์ม (คืนข้อความผิดพลาดภาษาไทย หรือ null) */
function validateField(f, v, data, {strict=true} = {}){
  if (!visible(f, data)) return null;
  if (isEmpty(v)) return f.required && strict && !f.auto ? (f.options || f.type === "rating" ? "กรุณาเลือกคำตอบ" : "กรุณากรอกข้อมูล") : null;
  if (f.type === "number") { const n = Number(v); if (isNaN(n)) return "กรุณากรอกเป็นตัวเลข"; if (f.min != null && n < f.min) return `ค่าต้องไม่น้อยกว่า ${f.min}`; if (f.max != null && n > f.max) return `ค่าต้องไม่เกิน ${f.max}`; }
  if (f.type === "rating" && !SCALE.some(s => s.v === Number(v))) return "ค่าคะแนนต้องอยู่ระหว่าง 1–5";
  if ((f.type === "radio" || f.type === "select") && !f.options.some(o => o.v === Number(v))) return "ตัวเลือกไม่ถูกต้อง";
  if (f.type === "checkbox") { const arr = Array.isArray(v) ? v : String(v).split(MULTI_SEP); if (arr.some(x => !f.options.some(o => o.v == x))) return "ตัวเลือกไม่ถูกต้อง"; if (f.minSelect && arr.length < f.minSelect) return `เลือกอย่างน้อย ${f.minSelect} ข้อ`; if (f.maxSelect && arr.length > f.maxSelect) return `เลือกได้ไม่เกิน ${f.maxSelect} ข้อ`; }
  if (f.maxLength && String(v).length > f.maxLength) return `ความยาวต้องไม่เกิน ${f.maxLength} ตัวอักษร`;
  if (f.pattern && !new RegExp(f.pattern).test(v)) return f.patternMsg || "รูปแบบข้อมูลไม่ถูกต้อง";
  if (f.type === "date" && isNaN(Date.parse(v))) return "วันที่ไม่ถูกต้อง";
  return null;
}
function validate(data, fields=FIELDS, opt){ const e = {}; for (const f of fields) { const m = validateField(f, data[f.name], data, opt); if (m) e[f.name] = m; } return e; }
function progressOf(data){
  const req = FIELDS.filter(f => f.required && !f.auto && visible(f, data));
  const done = req.filter(f => !isEmpty(data[f.name]) && !validateField(f, data[f.name], data)).length;
  return {done, total:req.length, pct:req.length ? Math.round(done / req.length * 100) : 0};
}
/** รับเฉพาะตัวแปรในแบบสอบถาม แปลงชนิดข้อมูลให้ตรงกับ Sheet */
function normalize(d){
  const o = {};
  for (const f of FIELDS) {
    let v = d[f.name];
    if (!visible(f, d)) v = "";
    if (isEmpty(v)) { o[f.name] = ""; continue; }
    if (f.type === "rating" || f.type === "radio" || f.type === "select" || f.type === "number") o[f.name] = isNaN(Number(v)) ? String(v) : Number(v);
    else if (f.type === "checkbox") o[f.name] = (Array.isArray(v) ? v : String(v).split(MULTI_SEP)).join(MULTI_SEP);
    else if (f.type === "toggle") o[f.name] = v ? 1 : 0;
    else o[f.name] = sanitizeText(v, f.maxLength);
  }
  return o;
}
/** ค่าในรายการ → ค่าในฟอร์ม (เช่น "1|3" → [1,3]) */
function toFormData(rec){ const d = {...rec}; FIELDS.forEach(f => { if (f.type === "checkbox" && typeof d[f.name] === "string") d[f.name] = d[f.name] ? d[f.name].split(MULTI_SEP).map(Number) : []; }); return d; }
const recMean = (r, items) => { const v = items.map(i => r[i]).filter(x => x !== "" && x != null && !isNaN(Number(x))).map(Number); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
function derive(r){ const o = {}; const r4 = x => x == null ? "" : Math.round(x * 10000) / 10000; SCHEMA.domains.forEach(d => o["mean_" + d.id] = r4(recMean(r, d.items))); o.mean_total = r4(recMean(r, ALL_ITEMS)); return o; }

/* =====================================================================
   5) SUMMARY ENGINE — โค้ดชุดเดียวกับ buildSummary ใน Code.gs
      คืนเฉพาะค่าสถิติรวม ปิดบังกลุ่มที่ n < minCell (ไม่มีข้อมูลรายบุคคล)
   ===================================================================== */
function buildSummary(records, filters, spec, opt) {
  opt = opt || {};
  const minCell = Number(opt.minCell) || 5;
  const dayKey = opt.dayKey || (s => String(s || '').slice(0, 10));
  const f = filters || {};
  const has = v => v !== undefined && v !== null && v !== '';
  const r4 = x => (x === null || x === undefined) ? null : Math.round(x * 10000) / 10000;
  const num = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
  const stats = vals => {
    const a = vals.filter(v => v !== null && v !== undefined); const n = a.length;
    if (!n) return { n: 0, mean: null, sd: null, min: null, max: null };
    const mean = a.reduce((s, x) => s + x, 0) / n;
    const sd = n > 1 ? Math.sqrt(a.reduce((s, x) => s + (x - mean) * (x - mean), 0) / (n - 1)) : 0;
    return { n, mean: r4(mean), sd: r4(sd), min: r4(Math.min.apply(null, a)), max: r4(Math.max.apply(null, a)) };
  };
  const rmean = (r, items) => { const v = items.map(i => num(r[i])).filter(x => x !== null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
  const level = m => { if (m === null) return null; const x = Math.round(m * 100) / 100; for (let i = 0; i < spec.levels.length; i++) if (x >= spec.levels[i]) return i; return spec.levels.length; };
  const submitted = records.filter(r => r.record_status === 'submitted');
  const lastTs = records.reduce((m, r) => { const t = Date.parse(r.updated_at || r.created_at || ''); return isNaN(t) ? m : Math.max(m, t); }, 0);
  const active = has(f.date_from) || has(f.date_to) || spec.filterVars.some(v => has(f[v.name]));
  const rows = submitted.filter(r => {
    const d = dayKey(r.created_at);
    if (has(f.date_from) && d < f.date_from) return false;
    if (has(f.date_to) && d > f.date_to) return false;
    return spec.filterVars.every(v => !has(f[v.name]) || num(r[v.name]) === Number(f[v.name]));
  });
  const out = { generated_at: new Date().toISOString(), total_all: submitted.length, n: rows.length, last_updated: lastTs ? new Date(lastTs).toISOString() : null, min_cell: minCell, filters_active: active, suppressed: active && rows.length < minCell };
  if (out.suppressed || !rows.length) return out;
  const itemStats = (rs, it) => { const vals = rs.map(r => num(r[it])); const s = stats(vals); s.dist = spec.scale.map(k => vals.filter(v => v === k).length); s.top2 = s.n ? r4((s.dist[0] + s.dist[1]) / s.n * 100) : 0; return s; };
  const domStats = (rs, d) => { const ms = rs.map(r => rmean(r, d.items)); const s = stats(ms); s.top2 = s.n ? r4(ms.filter(m => m !== null && level(m) <= 1).length / s.n * 100) : 0; return s; };
  const overallMeans = rows.map(r => rmean(r, spec.items));
  out.overall = stats(overallMeans);
  out.overall.levels = spec.levels.concat([0]).map((_, i) => overallMeans.filter(m => m !== null && level(m) === i).length);
  out.items = {}; let t2 = 0, tn = 0;
  spec.items.forEach(it => { const s = itemStats(rows, it); out.items[it] = s; t2 += s.dist[0] + s.dist[1]; tn += s.n; });
  out.overall.top2 = tn ? r4(t2 / tn * 100) : 0;
  out.domains = {}; spec.domains.forEach(d => { out.domains[d.id] = domStats(rows, d); });
  out.demographics = {};
  spec.filterVars.forEach(v => { const o = {}; v.codes.forEach(c => { o[c] = rows.filter(r => num(r[v.name]) === c).length; }); o.missing = rows.filter(r => num(r[v.name]) === null).length; out.demographics[v.name] = o; });
  out.oe_counts = {}; spec.oeVars.forEach(v => { out.oe_counts[v] = rows.filter(r => String(r[v] === null || r[v] === undefined ? '' : r[v]).trim() !== '').length; });
  const byDay = {}; rows.forEach(r => { const k = dayKey(r.created_at); (byDay[k] = byDay[k] || []).push(r); });
  out.trend = Object.keys(byDay).sort().map(k => { const g = byDay[k]; return { date: k, count: g.length, mean: g.length >= minCell ? stats(g.map(r => rmean(r, spec.items))).mean : null }; });
  out.groups = {};
  spec.filterVars.forEach(v => {
    out.groups[v.name] = {};
    v.codes.forEach(c => {
      const g = rows.filter(r => num(r[v.name]) === c);
      const e = { n: g.length, suppressed: g.length > 0 && g.length < minCell };
      if (g.length >= minCell) {
        e.overall = stats(g.map(r => rmean(r, spec.items))).mean;
        e.domains = {}; spec.domains.forEach(d => { e.domains[d.id] = domStats(g, d).mean; });
        e.items = {}; spec.items.forEach(it => { e.items[it] = stats(g.map(r => num(r[it]))).mean; });
      }
      out.groups[v.name][c] = e;
    });
  });
  return out;
}

/* =====================================================================
   6) DATA LAYER — API facade + 2 adapters
      LocalAdapter : Demo Mode (Local Storage)
      GasAdapter   : Google Apps Script Web App (Google Sheets)
      ทุกฟังก์ชันเป็น async และโยน ApiError {code, message, details, network}
   ===================================================================== */
class ApiError extends Error { constructor(code, message, details, network=false){ super(message); this.code = code; this.details = details || null; this.network = network; } }
const AUTH_CODES = ["AUTH_REQUIRED","TOKEN_INVALID"];
const Session = {
  get(){ try { return JSON.parse(sessionStorage.getItem(P + "session") || "null"); } catch { return null; } },
  set(s){ try { sessionStorage.setItem(P + "session", JSON.stringify(s)); } catch {} },
  clear(){ try { sessionStorage.removeItem(P + "session"); } catch {} },
  user(){ const s = Session.get(); return s && s.username; },
  token(){ const s = Session.get(); return s && s.token; }
};

const LocalAdapter = {
  mode:"local",
  cred(){
    let c = LS.get("cred", null);
    if (!c) { const salt = uid(); c = {username:APP_CONFIG.defaultAdmin.username, salt, hash:sha256(salt + APP_CONFIG.defaultAdmin.password), isDefault:true}; LS.set("cred", c); }
    return c;
  },
  needAuth(){ const u = Session.user(); if (!u || Session.get().mode !== "local") throw new ApiError("AUTH_REQUIRED", "ต้องเข้าสู่ระบบผู้ดูแลก่อน"); return u; },
  nextQid(recs){ const pre = cfg().qidPrefix || ""; let max = 0; recs.forEach(r => { const q = String(r.qid || ""); if (q.startsWith(pre)) { const m = q.slice(pre.length).match(/(\d+)$/); if (m) max = Math.max(max, +m[1]); } }); return pre + String(max + 1).padStart(4, "0"); },
  async status(){ return {status:"ok", mode:"local", records_submitted:Store.records().filter(r => r.record_status === "submitted").length}; },
  async summary(filters){ return buildSummary(Store.records(), filters, SUMMARY_SPEC, {minCell:+cfg().minCellSize || 5, dayKey:dkey}); },
  async list(){ LocalAdapter.needAuth(); return Store.records(); },
  async create(input, {asAdmin=false, by} = {}){
    const user = asAdmin ? LocalAdapter.needAuth() : null;
    const recs = Store.records();
    const id = input.record_id || newRecordId();
    const dup = recs.find(r => r.record_id === id);
    if (dup) return {data:dup, duplicate:true};
    const status = asAdmin && input.record_status === "draft" ? "draft" : "submitted";
    const rec = normalize(input);
    if (!rec.qid) rec.qid = LocalAdapter.nextQid(recs);
    const errs = validate(rec, FIELDS, {strict:status === "submitted"});
    if (Object.keys(errs).length) throw new ApiError("VALIDATION_ERROR", "ข้อมูลไม่ถูกต้องหรือไม่ครบถ้วน", errs);
    if (recs.some(r => String(r.qid).trim() === String(rec.qid).trim())) throw new ApiError("DUPLICATE_QID", `เลขที่แบบสอบถาม ${rec.qid} มีอยู่แล้ว`, {qid:"ซ้ำกับรายการที่มีอยู่"});
    const now = nowISO(), who = by || user || "public_form";
    const full = {record_id:id, ...rec, ...derive(rec), record_status:status, created_at:input.created_at && by ? input.created_at : now, created_by:who, updated_at:input.updated_at && by ? input.updated_at : now, updated_by:who};
    recs.push(full);
    if (!Store.saveRecords(recs)) throw new ApiError("STORAGE_ERROR", "บันทึกในเครื่องไม่สำเร็จ");
    if (by !== "demo") Store.log(who, "create", id, `เพิ่ม ${full.qid} (${status})`);
    return {data:full};
  },
  async update(id, patch){
    const user = LocalAdapter.needAuth();
    const recs = Store.records(), i = recs.findIndex(r => r.record_id === id);
    if (i < 0) throw new ApiError("NOT_FOUND", "ไม่พบรายการนี้ (อาจถูกลบแล้ว)");
    const old = recs[i], status = patch.record_status || old.record_status;
    const next = {...old, ...normalize({...old, ...patch})};
    if (!next.qid) throw new ApiError("VALIDATION_ERROR", "ต้องระบุเลขที่แบบสอบถาม", {qid:"กรุณากรอกข้อมูล"});
    const errs = validate(next, FIELDS, {strict:status === "submitted"});
    if (Object.keys(errs).length) throw new ApiError("VALIDATION_ERROR", "ข้อมูลไม่ถูกต้องหรือไม่ครบถ้วน", errs);
    if (recs.some(r => r.record_id !== id && String(r.qid).trim() === String(next.qid).trim())) throw new ApiError("DUPLICATE_QID", `เลขที่แบบสอบถาม ${next.qid} มีอยู่แล้ว`, {qid:"ซ้ำกับรายการที่มีอยู่"});
    const changes = [...FIELDS.map(f => f.name), "record_status"].filter(k => String(old[k] ?? "") !== String((k === "record_status" ? status : next[k]) ?? ""));
    Object.assign(next, derive(next), {record_status:status, updated_at:nowISO(), updated_by:user});
    recs[i] = next; Store.saveRecords(recs);
    Store.log(user, "update", id, `แก้ไข ${next.qid}: ` + changes.map(k => `${k} [${old[k] ?? ""} → ${next[k] ?? ""}]`).join("; "));
    return {data:next, changed:changes};
  },
  async remove(id){
    const user = LocalAdapter.needAuth();
    const recs = Store.records(), r = recs.find(x => x.record_id === id);
    if (!r) throw new ApiError("NOT_FOUND", "ไม่พบรายการนี้");
    Store.saveRecords(recs.filter(x => x.record_id !== id));
    Store.log(user, "delete", id, `ลบ ${r.qid} · สำเนา: ${JSON.stringify(r)}`);
    return {data:{record_id:id}};
  },
  async importMany(list){
    const user = LocalAdapter.needAuth(); const res = {imported:0, duplicates:0, failed:[]};
    for (const [i, x] of list.entries()) {
      try {
        const recs = Store.records();
        if (x.record_id && recs.some(r => r.record_id === x.record_id)) { res.duplicates++; continue; }
        if (x.qid && recs.some(r => String(r.qid).trim() === String(x.qid).trim())) { res.duplicates++; continue; }
        const by = x.created_by === "demo" ? "demo" : "import:" + user;
        try { await LocalAdapter.create({...x}, {asAdmin:true, by}); }
        catch (e) { if (e.code === "VALIDATION_ERROR" && x.record_status !== "draft") { await LocalAdapter.create({...x, record_status:"draft"}, {asAdmin:true, by}); res.failed.push({index:i, qid:x.qid, note:"บันทึกเป็น draft เพราะข้อมูลไม่ครบ"}); } else throw e; }
        res.imported++;
      } catch (e) { res.failed.push({index:i, qid:x.qid || "", error:e.code, message:e.message}); }
    }
    Store.log(user, "import", "", `นำเข้า ${res.imported} รายการ, ซ้ำ ${res.duplicates}, มีปัญหา ${res.failed.length}`);
    return {data:res};
  },
  async login(u, p){
    const c = LocalAdapter.cred();
    if (u !== c.username || sha256(c.salt + p) !== c.hash) throw new ApiError("INVALID_CREDENTIALS", "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
    Store.log(u, "login", "", "เข้าสู่ระบบ");
    return {token:"local-" + uid(), username:u, is_default:!!c.isDefault};
  },
  async logout(){ const u = Session.user(); if (u) Store.log(u, "logout", "", "ออกจากระบบ"); },
  async changePassword(cur, nu, np){
    const user = LocalAdapter.needAuth(), c = LocalAdapter.cred();
    if (sha256(c.salt + cur) !== c.hash) throw new ApiError("INVALID_CREDENTIALS", "รหัสผ่านปัจจุบันไม่ถูกต้อง");
    const salt = uid(); LS.set("cred", {username:nu, salt, hash:sha256(salt + np), isDefault:false});
    Store.log(user, "settings", "", `เปลี่ยนบัญชีผู้ดูแล (${user} → ${nu})`);
    return {username:nu};
  },
  async audit(){ LocalAdapter.needAuth(); return Store.audit(); }
};

const GasAdapter = {
  mode:"gas",
  url(){ return String(APP_CONFIG.GAS_API_URL || "").trim(); },
  /** เรียก API: POST ใช้ text/plain เพื่อหลีกเลี่ยง CORS preflight ของ Apps Script */
  async call(action, payload={}, {method="POST", retry=method === "GET" ? 1 : 0} = {}){
    for (let attempt = 0; ; attempt++) {
      const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), APP_CONFIG.apiTimeoutMs || 20000);
      Net.start();
      try {
        let res;
        if (method === "GET") {
          const qs = new URLSearchParams({action});
          Object.entries(payload).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== "") qs.set(k, typeof v === "object" ? JSON.stringify(v) : v); });
          res = await fetch(GasAdapter.url() + "?" + qs, {method:"GET", signal:ctrl.signal, redirect:"follow"});
        } else {
          res = await fetch(GasAdapter.url(), {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action, ...payload}), signal:ctrl.signal, redirect:"follow"});
        }
        if (!res.ok) throw new ApiError("HTTP_" + res.status, `API ตอบกลับผิดพลาด (HTTP ${res.status})`, null, true);
        let j;
        try { j = await res.json(); } catch { throw new ApiError("BAD_RESPONSE", "API ไม่ได้ส่ง JSON กลับมา — ตรวจสอบว่า Deploy เป็น Web app และตั้ง Who has access เป็น Anyone", null, true); }
        Net.state("online");
        if (!j || j.success !== true) throw new ApiError((j && j.error && j.error.code) || "API_ERROR", (j && j.message) || "API แจ้งข้อผิดพลาด", j && j.error && j.error.details);
        return j;
      } catch (e) {
        let err = e;
        if (e.name === "AbortError") err = new ApiError("TIMEOUT", "API ไม่ตอบสนองภายในเวลาที่กำหนด", null, true);
        else if (!(e instanceof ApiError)) err = new ApiError("NETWORK", navigator.onLine ? "เชื่อมต่อ API ไม่ได้ (ตรวจสอบ GAS_API_URL หรือการ Deploy)" : "ไม่มีการเชื่อมต่ออินเทอร์เน็ต", null, true);
        if (err.network) Net.state("offline");
        if (err.network && attempt < retry) { await new Promise(r => setTimeout(r, 800 * (attempt + 1))); continue; }
        throw err;
      } finally { clearTimeout(timer); Net.stop(); }
    }
  },
  tok(){ return {token:Session.token()}; },
  async status(){ return (await GasAdapter.call("status", {}, {method:"GET"})).data; },
  async summary(filters){ return (await GasAdapter.call("summary", {filters}, {method:"GET"})).data; },
  async list(){ return (await GasAdapter.call("read", {...GasAdapter.tok(), filters:{limit:10000}})).data.records; },
  async create(input, {asAdmin=false} = {}){ const j = await GasAdapter.call("create", {...(asAdmin ? GasAdapter.tok() : {}), data:input}); return {data:j.data, duplicate:!!(j.meta && j.meta.duplicate)}; },
  async update(id, patch){ const j = await GasAdapter.call("update", {...GasAdapter.tok(), record_id:id, data:patch}); return {data:j.data, changed:(j.meta && j.meta.changed_fields) || [], unchanged:!!(j.meta && j.meta.unchanged)}; },
  async remove(id){ return {data:(await GasAdapter.call("delete", {...GasAdapter.tok(), record_id:id})).data}; },
  async importMany(list){
    const res = {imported:0, duplicates:0, failed:[]};
    for (let i = 0; i < list.length; i += 500) { const d = (await GasAdapter.call("import", {...GasAdapter.tok(), records:list.slice(i, i + 500)})).data; res.imported += d.imported; res.duplicates += d.duplicates; res.failed.push(...d.failed); }
    return {data:res};
  },
  async login(u, p){ return (await GasAdapter.call("login", {username:u, password:p})).data; },
  async logout(){ try { await GasAdapter.call("logout", GasAdapter.tok()); } catch {} },
  async changePassword(cur, nu, np){ return (await GasAdapter.call("change_password", {...GasAdapter.tok(), current_password:cur, new_username:nu, new_password:np})).data; },
  async audit(){ return (await GasAdapter.call("audit", {...GasAdapter.tok(), limit:2000})).data; }
};

/** Facade: เลือก adapter อัตโนมัติจาก GAS_API_URL + จัดการ Session หมดอายุ + คิวออฟไลน์ */
const API = {
  get mode(){ return GasAdapter.url() ? "gas" : "local"; },
  get a(){ return API.mode === "gas" ? GasAdapter : LocalAdapter; },
  async run(fn){
    try { return await fn(API.a); }
    catch (e) {
      if (AUTH_CODES.includes(e.code) && Session.get()) { Session.clear(); toast("Session หมดอายุ กรุณาเข้าสู่ระบบใหม่", "warn"); if (Router.current === "admin") Admin.mount(); }
      throw e;
    }
  },
  status(){ return API.run(a => a.status()); },
  summary(f){ return API.run(a => a.summary(f)); },
  list(){ return API.run(a => a.list()); },
  update(id, p){ return API.run(a => a.update(id, p)); },
  remove(id){ return API.run(a => a.remove(id)); },
  importMany(l){ return API.run(a => a.importMany(l)); },
  audit(){ return API.run(a => a.audit()); },
  changePassword(c, u, p){ return API.run(a => a.changePassword(c, u, p)); },
  login(u, p){ return API.a.login(u, p); },
  logout(){ return API.a.logout(); },
  /** บันทึกจากหน้าสาธารณะ: ถ้าเครือข่ายล่ม → เก็บในคิวและส่งใหม่อัตโนมัติ (record_id เดิม ป้องกันซ้ำ) */
  async submitPublic(rec){
    try { return await API.a.create(rec); }
    catch (e) {
      if (API.mode === "gas" && e.network) { Outbox.add(rec); return {queued:true, data:rec}; }
      throw e;
    }
  },
  createAdmin(rec){ return API.run(a => a.create(rec, {asAdmin:true})); }
};

/* ---- คิวออฟไลน์ (Outbox) ---- */
const Outbox = {
  list(){ return LS.get("outbox", []); },
  add(rec){ const l = Outbox.list(); if (!l.some(x => x.record_id === rec.record_id)) l.push({...rec, _queued_at:nowISO()}); LS.set("outbox", l); Net.render(); },
  busy:false,
  async flush(manual=false){
    if (Outbox.busy || API.mode !== "gas") return;
    const l = Outbox.list(); if (!l.length) { if (manual) toast("ไม่มีรายการค้างส่ง"); return; }
    Outbox.busy = true; let sent = 0, failed = 0;
    for (const item of l) {
      const {_queued_at, ...rec} = item;
      try { await GasAdapter.create(rec); sent++; LS.set("outbox", Outbox.list().filter(x => x.record_id !== rec.record_id)); }
      catch (e) {
        if (e.network) break;                      // ยังออฟไลน์ — รอรอบถัดไป
        failed++;                                   // API ปฏิเสธ (เช่นข้อมูลไม่ถูกต้อง) — ย้ายไปรายการล้มเหลว
        LS.set("outbox", Outbox.list().filter(x => x.record_id !== rec.record_id));
        const bad = LS.get("outbox_failed", []); bad.push({...item, _error:`${e.code}: ${e.message}`}); LS.set("outbox_failed", bad);
      }
    }
    Outbox.busy = false; Net.render();
    if (sent) toast(`ส่งข้อมูลที่ค้างไว้ไปยัง Google Sheets แล้ว ${sent} รายการ`);
    if (failed) toast(`มี ${failed} รายการถูกปฏิเสธจาก API (ดูที่ ผู้ดูแล > ตั้งค่า)`, "err", 6000);
  }
};

      ${API.mode === "gas" ? `<span class="k">สถานะ</span><span>${Net.st === "online" ? '<span class="st ok">● เชื่อมต่อแล้ว</span>' : Net.st === "offline" ? '<span class="st er">● เชื่อมต่อไม่ได้</span>' : '<span class="st dr">● กำลังตรวจสอบ</span>'}</span>
      <span class="k">API URL</span><span><code class="c">${esc(GasAdapter.url().replace(/(\/s\/.{6}).+(.{6}\/exec)$/, "$1…$2"))}</code></span>
      <span class="k">ค้างส่ง</span><span>${q.length} รายการ</span><span class="k">ถูกปฏิเสธ</span><span>${bad.length} รายการ</span>` : `<span class="k">ข้อมูลในเครื่อง</span><span>${Store.records().length} รายการ</span>`}</div>
      <p class="small muted" style="margin:14px 0 0">${API.mode === "gas" ? "ข้อมูลที่ส่งไม่สำเร็จเพราะเครือข่ายขัดข้องจะถูกเก็บไว้ในเครื่องนี้ และส่งอัตโนมัติเมื่อเชื่อมต่อได้" : "เมื่อพร้อมใช้งานจริง ให้ใส่ URL ของ Apps Script Web App ที่ APP_CONFIG.GAS_API_URL ในไฟล์ index.html ระบบจะเปลี่ยนไปใช้ Google Sheets ทันที"}</p>`,
      footer: API.mode === "gas" ? `<button class="btn" id="niTest">${ic("wifi")}ทดสอบการเชื่อมต่อ</button><button class="btn primary" id="niFlush" ${q.length ? "" : "disabled"}>${ic("send")}ส่งรายการค้างตอนนี้</button>` : `<button class="btn" data-close>ปิด</button>`,

/* =====================================================================
   7) FORM RENDERER (schema-driven ใช้ทั้งหน้าสาธารณะและผู้ดูแล)
   ===================================================================== */
class FormRenderer {
  constructor(root, {stepped=true, data={}, admin=false, onChange=()=>{}} = {}){
    Object.assign(this, {root, stepped, admin, data:{...data}, errors:{}, step:0, onChange});
    this.steps = stepped ? [...SCHEMA.sections, {id:"REVIEW"}] : SCHEMA.sections;
    root.addEventListener("click", e => this.onClick(e));
    root.addEventListener("input", e => this.onInput(e));
    root.addEventListener("change", e => this.onInput(e));
  }
  fieldHTML(f){
    if (!visible(f, this.data)) return `<div class="field hidden" data-name="${f.name}"></div>`;
    const v = this.data[f.name], err = this.errors[f.name];
    let body = "";
    switch (f.type) {
      case "radio": case "checkbox":
        body = `<div class="opts" role="${f.type === "radio" ? "radiogroup" : "group"}">` + f.options.map(o => {
          const sel = f.type === "checkbox" ? (v || []).includes(o.v) : v === o.v;
          return `<button type="button" class="opt ${f.type === "checkbox" ? "cb" : ""} ${sel ? "sel" : ""}" role="${f.type === "radio" ? "radio" : "checkbox"}" aria-checked="${sel}" data-f="${f.name}" data-v="${o.v}"><span class="dot"></span><span>${esc(o.l)}</span></button>`;
        }).join("") + `</div>`; break;
      case "rating":
        body = `<div class="rating" role="radiogroup">` + SCALE.map(s =>
          `<button type="button" class="rate ${v === s.v ? "sel" : ""}" style="--c:${s.c}" role="radio" aria-checked="${v === s.v}" aria-label="${s.v} ${s.l}" data-f="${f.name}" data-v="${s.v}"><b>${s.v}</b><span>${s.l}</span></button>`).join("") + `</div>`; break;
      case "select":
        body = `<select class="inp" data-name="${f.name}"><option value="">— เลือก —</option>${f.options.map(o => `<option value="${o.v}" ${v == o.v ? "selected" : ""}>${esc(o.l)}</option>`).join("")}</select>`; break;
      case "toggle":
        body = `<button type="button" class="toggle ${v ? "on" : ""}" role="switch" aria-checked="${!!v}" data-toggle="${f.name}"><span class="tr"></span><span>${v ? (f.onLabel || "ใช่") : (f.offLabel || "ไม่ใช่")}</span></button>`; break;
      case "textarea":
        body = `<textarea class="inp" data-name="${f.name}" maxlength="${f.maxLength || ""}" placeholder="พิมพ์คำตอบของท่าน...">${esc(v || "")}</textarea><div class="small muted" style="text-align:right" data-count="${f.name}">${String(v || "").length}/${f.maxLength || "∞"}</div>`; break;
      default: {
        const t = ["number","date","time","email","tel"].includes(f.type) ? f.type : "text";
        body = `<input class="inp" type="${t}" data-name="${f.name}" value="${esc(v ?? "")}" ${f.min != null ? `min="${f.min}"` : ""} ${f.max != null ? `max="${f.max}"` : ""} ${f.maxLength ? `maxlength="${f.maxLength}"` : ""} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""} autocomplete="off">`;
      }
    }
    const rev = this.admin && f.revised ? ` <span class="st dr" title="${esc(SCHEMA.revisedNote)}">ปรับข้อความ</span>` : "";
    const tag = this.admin ? ` <span class="muted small">[${f.name}]</span>` : "";
    return `<div class="field ${err ? "has-err" : ""}" data-name="${f.name}">
      <div class="f-label">${f.no != null ? `<span class="no">${esc(f.no)}</span>` : ""}<span>${esc(f.label)}${f.required && !f.auto ? '<span class="req">*</span>' : ""}${rev}${tag}</span></div>
      ${f.help ? `<div class="f-help">${esc(f.help)}</div>` : ""}${body}
      ${err ? `<div class="f-err">${ic("alert")}${esc(err)}</div>` : ""}</div>`;
  }
  sectionHTML(s){
    if (s.id === "REVIEW") return this.reviewHTML();
    const legend = s.scale ? `<div class="scale-legend">${SCALE.map(x => `<span><i style="background:${x.c}"></i>${x.v} = ${x.l}</span>`).join("")}</div>` : "";
    return `<div class="sec-head"><div class="part">${esc(s.part)}</div><h2>${esc(s.title)}</h2>${s.note ? `<p>${esc(s.note)}</p>` : ""}</div>
      ${s.intro && this.stepped ? `<div class="intro"><b>คำชี้แจง:</b> ${SCHEMA.intro}</div>` : ""}${legend}
      ${s.fields.map(f => this.fieldHTML(f)).join("")}`;
  }
  reviewHTML(){
    return `<div class="sec-head"><div class="part">ขั้นตอนสุดท้าย</div><h2>ตรวจทานคำตอบก่อนบันทึก</h2><p>ตรวจสอบความถูกต้อง หากต้องการแก้ไขให้กด “แก้ไข” ในแต่ละตอน</p></div>
      <div class="review-list">${SCHEMA.sections.map((s, i) => `<div class="review-sec"><h4><span>${esc(s.part.split(" ").slice(0,2).join(" "))} · ${esc(s.title)}</span><button class="btn sm soft" data-goto="${i}">${ic("edit")}แก้ไข</button></h4>
        ${s.fields.filter(f => visible(f, this.data)).map(f => { const v = this.data[f.name], miss = isEmpty(v);
          const show = miss ? (f.auto ? "กำหนดอัตโนมัติ" : f.required ? "ยังไม่ได้ตอบ" : "–") : f.type === "textarea" ? (String(v).length > 60 ? String(v).slice(0, 60) + "…" : v) : f.type === "rating" ? v : f.options ? optLabel(f.name, Array.isArray(v) ? v.join(MULTI_SEP) : v) : v;
          return `<div class="review-row"><span class="k">${typeof f.no === "number" ? f.no + ". " : ""}${esc(f.label)}</span><span class="v ${miss && f.required && !f.auto ? "miss" : ""}">${esc(show)}</span></div>`; }).join("")}</div>`).join("")}</div>
      <p class="small muted" style="margin-top:14px">${esc(SCHEMA.thanks)}</p>`;
  }
  render(){
    this.root.innerHTML = this.stepped
      ? `<div class="glass section-card">${this.sectionHTML(this.steps[this.step])}</div>`
      : SCHEMA.sections.map(s => `<div class="glass section-card" style="margin-bottom:14px;box-shadow:none">${this.sectionHTML(s)}</div>`).join("");
    this.onChange(this);
  }
  refreshField(name){
    const el = $(`.field[data-name="${name}"]`, this.root);
    if (el) el.outerHTML = this.fieldHTML(F[name]);
    FIELDS.filter(x => x.showIf && x.showIf.field === name).forEach(x => this.refreshField(x.name));
  }
  setVal(name, v){
    this.data[name] = v;
    if (this.errors[name]) { const e = validateField(F[name], v, this.data); if (e) this.errors[name] = e; else delete this.errors[name]; }
    this.onChange(this);
  }
  onClick(e){
    const opt = e.target.closest("[data-f]");
    if (opt) {
      const f = F[opt.dataset.f], v = +opt.dataset.v;
      if (f.type === "checkbox") { const arr = [...(this.data[f.name] || [])]; const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v); this.setVal(f.name, arr.sort((a, b) => a - b)); }
      else this.setVal(f.name, v);
      this.refreshField(f.name);
      const nb = $(`.field[data-name="${f.name}"] [data-v="${v}"]`, this.root); nb && nb.focus({preventScroll:true});
      return;
    }
    const tg = e.target.closest("[data-toggle]");
    if (tg) { const n = tg.dataset.toggle; this.setVal(n, !this.data[n]); this.refreshField(n); return; }
    const go = e.target.closest("[data-goto]");
    if (go) this.goStep(+go.dataset.goto);
  }
  onInput(e){
    const el = e.target; if (!el.dataset || !el.dataset.name || !("value" in el)) return;
    const f = F[el.dataset.name]; if (!f) return;
    let v = el.value;
    if (f.type === "number") v = v === "" ? "" : Number(v);
    if (f.type === "select") v = v === "" ? "" : (isNaN(+v) ? v : +v);
    this.setVal(f.name, v);
    const cnt = $(`[data-count="${f.name}"]`, this.root); if (cnt) cnt.textContent = `${String(v).length}/${f.maxLength || "∞"}`;
    if (e.type === "change") FIELDS.filter(x => x.showIf && x.showIf.field === f.name).forEach(x => this.refreshField(x.name));
  }
  validateStep(){
    const s = this.steps[this.step]; if (!s.fields) return true;
    s.fields.forEach(f => delete this.errors[f.name]);
    const errs = validate(this.data, s.fields); Object.assign(this.errors, errs);
    return !Object.keys(errs).length;
  }
  validateAll(opt){ this.errors = validate(this.data, FIELDS, opt); return !Object.keys(this.errors).length; }
  /** แสดงข้อผิดพลาดจาก API (VALIDATION_ERROR / DUPLICATE_QID) ที่ช่องที่เกี่ยวข้อง */
  applyServerErrors(details){ if (!details || typeof details !== "object") return false; let any = false; Object.entries(details).forEach(([k, m]) => { if (F[k]) { this.errors[k] = String(m); any = true; } }); return any; }
  goStep(i){ this.step = Math.max(0, Math.min(this.steps.length - 1, i)); this.render(); window.scrollTo({top:0, behavior:"smooth"}); }
  scrollToErr(){ const el = $(".field.has-err", this.root); if (el) { el.scrollIntoView({behavior:"smooth", block:"center"}); const b = $("button,input,textarea,select", el); b && setTimeout(() => b.focus({preventScroll:true}), 350); } }
}

      <div class="glass hero"><span class="eyebrow">${ic("log")} ${esc(c.orgName)}</span><h1>${esc(c.headerTitle)}</h1><p>${esc(c.headerSubtitle)}</p></div>
      <div id="draftBanner"></div>
      <div class="glass progress-card"><div class="progress-top"><span id="pgStep"></span><span>ตอบแล้ว <b id="pgTxt">0</b></span></div><div class="pbar"><i id="pgBar"></i></div><div class="stepper" id="stepper"></div></div>
      <div id="formRoot"></div>
      <input class="hp" id="hpField" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="glass form-actions">
        <button class="btn" id="bPrev">${ic("left")}ย้อนกลับ</button>
        <button class="btn ghost" id="bDraft">${ic("save")}บันทึกร่าง</button>
        <button class="btn ghost" id="bClear">${ic("refresh")}ล้างข้อมูล</button>
        <span class="spacer"></span>
        <button class="btn primary" id="bNext">ถัดไป${ic("right")}</button>
        <button class="btn primary hidden" id="bSubmit">${ic("send")}บันทึกข้อมูล</button>
      </div>
      <p class="small muted" style="text-align:center;margin-top:16px">ต้องการดูผลสรุป? <a href="#/dashboard">เปิด Dashboard สาธารณะ →</a></p>
    </div>`;
    FormView.recordId = newRecordId();
    FormView.fr = new FormRenderer($("#formRoot"), {stepped:true, data:{}, onChange:FormView.update});
    FormView.fr.render();
    FormView.checkDraft();
    $("#bPrev").onclick = () => FormView.fr.goStep(FormView.fr.step - 1);
    $("#bNext").onclick = () => { if (FormView.fr.validateStep()) FormView.fr.goStep(FormView.fr.step + 1); else { FormView.fr.render(); FormView.fr.scrollToErr(); toast("กรุณาตอบคำถามที่บังคับให้ครบถ้วน", "warn"); } };
    $("#bDraft").onclick = FormView.saveDraft;
    $("#bClear").onclick = FormView.clear;
    $("#bSubmit").onclick = FormView.submit;
    $("#stepper").onclick = e => { const b = e.target.closest("[data-step]"); if (b) FormView.fr.goStep(+b.dataset.step); };
  },
  update(fr){
    const p = progressOf(fr.data);
    $("#pgBar").style.width = p.pct + "%";
    $("#pgTxt").textContent = `${p.done}/${p.total} ข้อ (${p.pct}%)`;
    $("#pgStep").textContent = `ขั้นตอน ${fr.step + 1} จาก ${fr.steps.length}`;
    $("#stepper").innerHTML = fr.steps.map((s, i) => {
      const done = s.fields ? s.fields.filter(f => f.required && !f.auto && visible(f, fr.data)).every(f => !isEmpty(fr.data[f.name])) : false;
      const short = s.id === "REVIEW" ? "ตรวจทาน" : s.id === "P1" ? "ข้อมูลทั่วไป" : s.id === "P3" ? "ข้อเสนอแนะ" : s.title.split(" ").slice(0,2).join(" ");
      const mark = done && i !== fr.step;
      return `<button class="step-chip ${i === fr.step ? "cur" : ""} ${mark ? "done" : ""}" data-step="${i}"><span class="n">${mark ? "✓" : i + 1}</span>${esc(short)}</button>`;
    }).join("");
    const last = fr.step === fr.steps.length - 1;
    $("#bPrev").disabled = fr.step === 0;
    $("#bNext").classList.toggle("hidden", last);
    $("#bSubmit").classList.toggle("hidden", !last);
  },
  checkDraft(){
    const d = LS.get("draft", null), el = $("#draftBanner");
    if (!d) { el.innerHTML = ""; return; }
    el.innerHTML = `<div class="banner">${ic("save")}<span style="flex:1">พบร่างที่บันทึกไว้เมื่อ <b>${fmtDT(d.savedAt)}</b> ต้องการกู้คืนหรือไม่?</span><button class="btn sm primary" id="dRestore">กู้คืนร่าง</button><button class="btn sm" id="dDiscard">ทิ้งร่าง</button></div>`;
    $("#dRestore").onclick = () => { FormView.fr.data = {...d.data}; FormView.fr.errors = {}; FormView.fr.step = d.step || 0; if (d.recordId) FormView.recordId = d.recordId; FormView.fr.render(); el.innerHTML = ""; toast("กู้คืนร่างเรียบร้อย"); };
    $("#dDiscard").onclick = () => { LS.del("draft"); el.innerHTML = ""; toast("ลบร่างแล้ว", "warn"); };
  },
  saveDraft(){
    if (LS.set("draft", {data:FormView.fr.data, step:FormView.fr.step, recordId:FormView.recordId, savedAt:nowISO()})) { $("#draftBanner").innerHTML = ""; toast("บันทึกร่างไว้ในเครื่องนี้แล้ว สามารถกลับมาทำต่อได้"); }
  },
  async clear(){
    if (!await confirmDialog({title:"ล้างข้อมูลที่กรอก?", body:"คำตอบทั้งหมดในแบบฟอร์มนี้จะถูกล้าง (ร่างที่บันทึกไว้จะไม่ถูกลบ)", ok:"ล้างข้อมูล", danger:true})) return;
    FormView.fr.data = {}; FormView.fr.errors = {}; FormView.recordId = newRecordId(); FormView.fr.goStep(0); toast("ล้างข้อมูลแล้ว", "warn");
  },
  async submit(){
    if (FormView.submitting) return;                    // ป้องกันกดซ้ำ
    const fr = FormView.fr;
    if (!fr.validateAll()) {
      const first = FIELDS.find(f => fr.errors[f.name]);
      fr.goStep(SCHEMA.sections.findIndex(s => s.id === first.section)); setTimeout(() => fr.scrollToErr(), 50);
      toast(`ยังตอบไม่ครบ ${Object.keys(fr.errors).length} ข้อ กรุณาตรวจสอบ`, "err"); return;
    }
    FormView.submitting = true;
    const btn = $("#bSubmit"); btn.disabled = true; btn.innerHTML = `<span class="spin"></span>กำลังบันทึก...`;
    try {
      const rec = {record_id:FormView.recordId, ...normalize(fr.data), record_status:"submitted"};
      if ($("#hpField").value) rec._hp = $("#hpField").value;
      const res = await API.submitPublic(rec);
      LS.del("draft");
      FormView.done = {...res.data, queued:!!res.queued, duplicate:!!res.duplicate};
      FormView.renderSuccess();
      toast(res.queued ? "เครือข่ายขัดข้อง: เก็บข้อมูลไว้ในเครื่องแล้ว จะส่งอัตโนมัติ" : "บันทึกข้อมูลสำเร็จ ขอบคุณที่ตอบแบบสอบถาม", res.queued ? "warn" : "ok", 5000);
      if (Router.current === "dashboard") Dash.load(true);
    } catch (e) {
      if (fr.applyServerErrors(e.details)) { const first = FIELDS.find(f => fr.errors[f.name]); fr.goStep(SCHEMA.sections.findIndex(s => s.id === first.section)); setTimeout(() => fr.scrollToErr(), 50); }
      toast(`บันทึกไม่สำเร็จ: ${e.message}`, "err", 6000);
      btn.disabled = false; btn.innerHTML = ic("send") + "บันทึกข้อมูล";
    } finally { FormView.submitting = false; }
  },
  renderSuccess(){
    const d = FormView.done, root = $("#view-form");
    root.dataset.mounted = "";
    root.innerHTML = `<div class="form-wrap"><div class="glass success">
      <div class="check ${d.queued ? "q" : ""}">${ic(d.queued ? "cloud" : "check")}</div>
      <h1 style="margin:0 0 6px;font-size:24px">${d.queued ? "บันทึกไว้ในเครื่องแล้ว" : "บันทึกข้อมูลสำเร็จ"}</h1>
      <p style="color:var(--text-2);margin:0 0 4px">${d.queued ? "ขณะนี้เชื่อมต่อ Google Sheets ไม่ได้ ระบบจะส่งข้อมูลให้อัตโนมัติเมื่อกลับมาออนไลน์ (กรุณาอย่าล้างข้อมูลเบราว์เซอร์)" : esc(SCHEMA.thanks)}</p>
      <p class="small muted">${d.qid ? `เลขที่แบบสอบถาม <b>${esc(d.qid)}</b> · ` : ""}รหัสรายการ <code class="c">${esc(d.record_id)}</code>${d.created_at ? " · " + fmtDT(d.created_at) : ""}</p>
      <div class="btn-row" style="justify-content:center;margin-top:22px"><button class="btn primary" id="bNew">${ic("plus")}เริ่มรายการใหม่</button><a class="btn" href="#/dashboard">${ic("chart")}ดู Dashboard</a></div></div></div>`;
    $("#bNew").onclick = () => { FormView.done = null; FormView.fr = null; FormView.mount(); window.scrollTo({top:0}); };
  }
};

/* =====================================================================
   9) CHARTS (SVG/CSS ภายในไฟล์ ไม่ต้องใช้ไลบรารีภายนอก)
   ===================================================================== */
function hbars(rows, max=5, fmt=f2){
  if (!rows.length) return `<div class="muted small">ไม่มีข้อมูล</div>`;
  return `<div class="bars">${rows.map(r => `<div class="bar-row" ${r.drill ? `data-drill="${r.drill}"` : ""} title="${esc(r.title || r.label)}"><span class="bl">${esc(r.label)}</span><span class="track"><i style="width:${r.value == null ? 0 : Math.max(0, Math.min(100, r.value / max * 100))}%;background:${r.color || "linear-gradient(90deg,var(--primary),var(--accent))"}"></i></span><span class="bv">${r.text ?? fmt(r.value)}</span></div>`).join("")}</div>`;
}
function stacked(rows){
  return `<div class="legend">${SCALE.map(s => `<span><i style="background:${s.c}"></i>${s.v} ${s.l}</span>`).join("")}</div><div class="bars" style="gap:6px">${rows.map(r => { const tot = r.dist.reduce((a, b) => a + b, 0);
    return `<div class="stack-row" data-drill="${r.drill}" title="${esc(r.title)}"><b class="small">${esc(r.label)}</b><div class="stack">${tot ? r.dist.map((c, i) => c ? `<i style="width:${c / tot * 100}%;background:${SCALE[i].c}" title="${SCALE[i].l}: ${c} (${(c / tot * 100).toFixed(1)}%)">${c / tot >= .08 ? Math.round(c / tot * 100) + "%" : ""}</i>` : "").join("") : ""}</div><span class="small muted" style="text-align:right">${f2(r.mean)}</span></div>`; }).join("")}</div>`;
}
const PAL = ["#2563eb","#7c3aed","#06b6d4","#f59e0b","#ec4899","#10b981","#64748b"];
function donut(parts){
  const tot = parts.reduce((s, p) => s + p.value, 0); let acc = 0; const R = 52, C = 2 * Math.PI * R;
  const segs = tot ? parts.map((p, i) => { const len = p.value / tot * C; const s = `<circle cx="65" cy="65" r="${R}" fill="none" stroke="${p.color || PAL[i % PAL.length]}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 65 65)" ${p.drill ? `data-drill="${p.drill}" style="cursor:pointer"` : ""}><title>${esc(p.label)}: ${p.value}</title></circle>`; acc += len; return s; }).join("") : "";
  return `<div class="donut-wrap"><svg viewBox="0 0 130 130"><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--line)" stroke-width="18"/>${segs}<text x="65" y="62" text-anchor="middle" font-size="20" font-weight="700" style="fill:var(--text)">${tot}</text><text x="65" y="80" text-anchor="middle" font-size="10">ราย</text></svg>
    <div style="flex:1;min-width:140px;display:grid;gap:6px">${parts.map((p, i) => `<div class="bar-row" style="grid-template-columns:12px minmax(0,1fr) auto" ${p.drill ? `data-drill="${p.drill}"` : ""}><i style="width:10px;height:10px;border-radius:3px;background:${p.color || PAL[i % PAL.length]}"></i><span class="bl">${esc(p.label)}</span><span class="bv">${p.value} <span class="muted small">(${f1p(pct(p.value, tot))})</span></span></div>`).join("")}</div></div>`;
}
function radar(vals, labels){
  const cx = 160, cy = 130, R = 95, n = vals.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 5, cy + Math.sin(a) * R * v / 5]; };
  let g = "";
  for (let k = 1; k <= 5; k++) g += `<polygon points="${labels.map((_, i) => pt(i, k).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`;
  labels.forEach((l, i) => { const [x, y] = pt(i, 5); const [lx, ly] = pt(i, 6.1); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/><text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="12" font-weight="600">${esc(l)}</text>`; });
  g += `<polygon points="${vals.map((v, i) => pt(i, v || 0).join(",")).join(" ")}" fill="color-mix(in srgb,var(--primary) 25%,transparent)" stroke="var(--primary)" stroke-width="2.5"/>`;
  vals.forEach((v, i) => { const [x, y] = pt(i, v || 0); g += `<circle cx="${x}" cy="${y}" r="5" fill="var(--primary)" stroke="#fff" stroke-width="2" data-drill="domain:${SCHEMA.domains[i].id}" style="cursor:pointer"><title>${esc(labels[i])}: ${f2(v)}</title></circle>`; });
  return `<div class="chart"><svg viewBox="0 0 320 260">${g}</svg></div>`;
}
function lineChart(points){
  if (!points.length) return `<div class="muted small">ไม่มีข้อมูล</div>`;
  const W = 640, H = 230, pl = 40, pr = 40, pt = 16, pb = 34;
  const maxC = Math.max(1, ...points.map(p => p.count));
  const x = i => pl + (points.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (points.length - 1));
  const yC = v => H - pb - v / maxC * (H - pt - pb), yM = v => H - pb - (v - 1) / 4 * (H - pt - pb);
  const bw = Math.max(4, Math.min(28, (W - pl - pr) / points.length * .6));
  let g = "";
  for (let k = 0; k <= 4; k++) { const y = pt + k * (H - pt - pb) / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" font-size="10">${Math.round(maxC * (1 - k / 4))}</text><text x="${W - pr + 6}" y="${y + 4}" font-size="10">${5 - k}</text>`; }
  points.forEach((p, i) => { g += `<rect x="${x(i) - bw / 2}" y="${yC(p.count)}" width="${bw}" height="${H - pb - yC(p.count)}" rx="4" fill="color-mix(in srgb,var(--primary) 35%,transparent)"><title>${esc(p.label)}: ${p.count} ราย</title></rect>`; });
  const step = Math.ceil(points.length / 8);
  points.forEach((p, i) => { if (i % step === 0 || i === points.length - 1) g += `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" font-size="10">${esc(p.short)}</text>`; });
  const mp = points.map((p, i) => p.mean != null ? `${x(i)},${yM(p.mean)}` : null).filter(Boolean);
  if (mp.length) { g += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${mp.join(" ")}"/>`;
    points.forEach((p, i) => { if (p.mean != null) g += `<circle cx="${x(i)}" cy="${yM(p.mean)}" r="4" fill="var(--accent)" stroke="#fff" stroke-width="1.5"><title>${esc(p.label)}: เฉลี่ย ${f2(p.mean)}</title></circle>`; }); }
  return `<div class="legend"><span><i style="background:color-mix(in srgb,var(--primary) 35%,transparent)"></i>จำนวนผู้ตอบ (แกนซ้าย)</span><span><i style="background:var(--accent)"></i>ค่าเฉลี่ยรวม (แกนขวา · แสดงเฉพาะวันที่มีผู้ตอบ ≥ เกณฑ์ขั้นต่ำ)</span></div><div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}
const levelBadge = m => { const it = interp(m); return `<span class="badge" style="background:${it.c}">${it.l}</span>`; };
const statCards = arr => `<div class="grid g4" style="gap:10px;margin-bottom:16px">${arr.map(([l, v]) => `<div class="domain-card" style="cursor:default"><div class="dn">${l}</div><div class="dv" style="font-size:22px">${v}</div></div>`).join("")}</div>`;

/* =====================================================================
   10) PUBLIC DASHBOARD — แสดงผลจาก summary เท่านั้น (ไม่ดึงข้อมูลรายบุคคล)
   ===================================================================== */
const Dash = {
  f:{date_from:"", date_to:"", q:"", sortK:"no", sortD:1, cmp:"prof"},
  s:null, err:null, seq:0, loading:false,
  mount(){ Dash.load(); },
  apiFilters(){ const o = {}; ["date_from","date_to"].forEach(k => { if (Dash.f[k]) o[k] = Dash.f[k]; }); FILTER_FIELDS.forEach(f => { if (Dash.f[f.name] !== undefined && Dash.f[f.name] !== "") o[f.name] = +Dash.f[f.name]; }); return o; },
  active(){ return Object.keys(Dash.apiFilters()).length > 0; },
  async load(silent=false){
    const seq = ++Dash.seq; Dash.loading = true;
    if (!silent && !Dash.s) Dash.drawSkeleton();
    try {
      /* dashboardGasOnly: ดึงสรุปจาก Google Sheets (action=summary) เท่านั้น ไม่ใช้ Local Storage */
      let s;
      if (APP_CONFIG.dashboardGasOnly) {
        if (!GasAdapter.url()) throw new ApiError("CONFIG_ERROR", "Dashboard แสดงเฉพาะข้อมูลจาก Google Sheets — กรุณาตั้งค่า GAS_API_URL ใน APP_CONFIG");
        s = await GasAdapter.summary(Dash.apiFilters());
      } else s = await API.summary(Dash.apiFilters());
      if (seq !== Dash.seq) return; Dash.s = s; Dash.err = null;
    }
    catch (e) { if (seq !== Dash.seq) return; Dash.err = e; if (silent && Dash.s) { Dash.loading = false; return; } }
    Dash.loading = false;
    if (Router.current === "dashboard") Dash.draw();
  },
  drawSkeleton(){ $("#view-dashboard").innerHTML = `<div class="skel" style="min-height:150px;margin-bottom:16px"></div><div class="grid kpis">${'<div class="skel"></div>'.repeat(5)}</div><div class="grid g2" style="margin-top:16px"><div class="skel" style="min-height:300px"></div><div class="skel" style="min-height:300px"></div></div>`; },
  head(){
    const c = cfg(), s = Dash.s;
    return `<div class="glass hero"><span class="eyebrow">${ic("chart")} Dashboard สาธารณะ · ${esc(c.orgName)}</span><h1>${esc(c.headerTitle)}</h1><p><b style="color:var(--text)">${esc(c.orgName)}</b> · ${esc(c.headerSubtitle)}</p>
      <div class="updated"><span class="pulse"></span>ข้อมูลอัปเดตล่าสุด ${s && s.last_updated ? fmtDT(s.last_updated) : "–"} · ดึงข้อมูลเมื่อ ${s ? fmtDT(s.generated_at) : "–"} · แสดง ${s ? s.n : 0} จาก ${s ? s.total_all : 0} ราย
      <span class="st ${APP_CONFIG.dashboardGasOnly || API.mode === "gas" ? "ok" : "dr"}">${APP_CONFIG.dashboardGasOnly || API.mode === "gas" ? "แหล่งข้อมูล: Google Sheets" : "Demo Mode"}</span>
      <button class="btn sm ghost" data-refresh>${Dash.loading ? '<span class="spin"></span>' : ic("refresh")}รีเฟรช</button></div></div>`;
  },
  filtersHTML(){
    return `<div class="glass filters"><div class="filters-grid">
        <div><label>ตั้งแต่วันที่</label><input type="date" class="sel" data-df="date_from" value="${Dash.f.date_from}"></div>
        <div><label>ถึงวันที่</label><input type="date" class="sel" data-df="date_to" value="${Dash.f.date_to}"></div>
        <div><label>ช่วงเวลา</label><select class="sel" data-quick><option value="">กำหนดเอง</option><option value="7">7 วันล่าสุด</option><option value="30">30 วันล่าสุด</option><option value="90">90 วันล่าสุด</option><option value="all">ทั้งหมด</option></select></div>
        ${FILTER_FIELDS.map(f => `<div><label>${esc(shortLbl(f.name))}</label><select class="sel" data-df="${f.name}"><option value="">ทั้งหมด</option>${f.options.map(o => `<option value="${o.v}" ${Dash.f[f.name] == o.v ? "selected" : ""}>${esc(o.l)}</option>`).join("")}</select></div>`).join("")}
      </div><div class="chips">${Dash.active() ? `<button class="chip" data-reset>${ic("refresh")}รีเซ็ตตัวกรองทั้งหมด</button>` : `<span class="small muted">เลือกตัวกรองเพื่อเจาะลึกข้อมูล · คลิกกราฟหรือการ์ดเพื่อดูรายละเอียด</span>`}</div></div>`;
  },
  draw(){
    const root = $("#view-dashboard"), s = Dash.s;
    if (Dash.err && !s) { root.innerHTML = `<div class="glass empty"><div class="big">⚠️</div><h3>โหลดข้อมูลไม่สำเร็จ</h3><p>${esc(Dash.err.message)}</p><button class="btn primary" data-refresh>${ic("refresh")}ลองใหม่</button></div>`; Dash.bind(); return; }
    if (!s) return Dash.drawSkeleton();
